<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A memory-based Simon Says game built with HTML, CSS and JavaScript.">
  <title>Simon Says Game | Nandani Garg</title>
  <link rel="stylesheet" href="simon.css?v=3">
</head>
<body>
  <main class="game">
    <h1>Simon Says Game</h1>
    <h2 id="game-status">Press Start or any key to play</h2>
    <button id="start-btn" class="start-btn" type="button">Start Game</button>

    <section class="btn-container" aria-label="Simon game buttons">
      <div class="line-one">
        <button class="btn red" id="red" aria-label="Red"></button>
        <button class="btn yellow" id="yellow" aria-label="Yellow"></button>
      </div>
      <div class="line-two">
        <button class="btn green" id="green" aria-label="Green"></button>
        <button class="btn purple" id="purple" aria-label="Purple"></button>
      </div>
    </section>
  </main>
  <script src="simon.js?v=3"></script>
</body>
</html>
